# ------------------------------------------------------------------
# Local development stack: Postgres + Redis for `npm run start:dev`.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Ports match .env.development. Nothing here belongs in production: the
# production stack is the platform's business, not this file's.
# ------------------------------------------------------------------
name: app

services:
  database:
    container_name: app-db
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=app
      - POSTGRES_PASSWORD=postgres
    volumes:
      - app-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cache:
    container_name: app-cache
    image: redis:8.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - app-cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  app-db:
  app-cache:
